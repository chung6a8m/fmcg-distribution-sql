name: Business contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-model:
    name: Docs and synthetic-model checks only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate business contract without runtime dependencies
        run: python3 tools/validate_business.py
